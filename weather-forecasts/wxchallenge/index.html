<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WXChallenge Forecasts</title>
  <style>
    /* Minimal readable styling */
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem}
    header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse;margin-top:0.5rem}
    th,td{border:1px solid #e6e6e6;padding:8px;text-align:left}
    th{background:#fafafa}
    .muted{color:#666;font-size:0.95rem}
    .back{margin-bottom:1rem;display:inline-block}
    img{width:100%;height:auto;border-radius:8px;margin-top:1rem}
  </style>
</head>

<body>
  <a class="back" href="../">← Back</a>

  <header>
    <h1>WXChallenge Forecasts</h1>
    <div id="updated" class="muted">Loading…</div>
  </header>

  <!-- Subheading and valid-range (populated by script) -->
  <h2 id="forecast-for">Forecasting for —</h2>
  <h3 id="valid-range" class="muted">Valid: —</h3>

  <!-- Single table: models are rows, variables are columns -->
  <section>
    <table id="models-table" aria-label="Model comparison table">
      <thead>
        <tr>
          <th>Model</th>
          <th>High (°F)</th>
          <th>Low (°F)</th>
          <th>Precipitation (in)</th>
          <th>Wind Speed (kt)</th>
          <th>Model Init (UTC)</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Latest Figure</h2>
    <img id="fig" alt="latest WXChallenge figure"/>
  </section>

<script>
/* Simple helper to render missing values */
function fmt(v){ return v===null||v===undefined ? '—' : v; }

/*
  Fetch a simple JSON schema and populate the page.

  Expected JSON format (simple, no legacy transformations):
  {
    "generated_at_utc": "2025-09-02T05:00:00Z",
    "meta": { "site": "Loveland, CO (KFNL)" },
    "models": {
      "HRRR": { ... },
      "IFS": { ... },
      "GFS": { ... },
      "NBM": { ... },
      "IFS_ens": { ... },   // optional key name used for "IFS Ens"
      "AIFS": { ... }
    }
  }
*/
(async function(){
  try{
    // fetch the JSON produced by your Python script (no legacy mapping here)
    const res = await fetch('../data/wxchallenge/forecast.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
    const data = await res.json();

    // Updated timestamp
    if (data?.generated_at_utc) {
      document.getElementById('updated').textContent = 'Last updated: ' + new Date(data.generated_at_utc).toLocaleString();
    } else {
      document.getElementById('updated').textContent = 'Last updated: —';
    }

    // Site name
    const site = data?.meta?.site ?? '—';
    document.getElementById('forecast-for').textContent = `Forecasting for ${site}`;

    // Valid range: prefer a model order (HRRR, IFS, GFS, NBM, IFS_ens, AIFS) then meta
    const preferKeys = ['HRRR','IFS','GFS','NBM','IFS_ens','AIFS'];
    let validRange = null;
    for (const k of preferKeys) {
      const v = data?.models?.[k]?.valid_range_utc ?? null;
      if (v) { validRange = v; break; }
    }
    if (!validRange) {
      validRange = data?.meta?.valid_range_utc ?? null;
      if (!validRange && data?.generated_at_utc) validRange = [data.generated_at_utc, data.generated_at_utc];
    }
    document.getElementById('valid-range').textContent = validRange ? `Valid: ${validRange[0]} - ${validRange[1]} UTC` : 'Valid: —';

    // Build table rows for models: show HRRR, ECMWF IFS, GFS, NBM, IFS Ens, AIFS
    const modelMap = [
      { key: 'HRRR',   label: 'HRRR' },
      { key: 'IFS',    label: 'ECMWF IFS' },
      { key: 'GFS',    label: 'GFS' },
      { key: 'NBM',    label: 'NBM' },
      { key: 'IFS_ens',label: 'IFS Ens' },
      { key: 'AIFS',   label: 'AIFS' }
    ];

    function rowHtml(displayName, m){
      if (!m) return `<tr><td>${displayName}</td><td colspan="5">no data</td></tr>`;
      return `<tr>
        <td>${displayName}</td>
        <td>${fmt(m.tmax_f)}</td>
        <td>${fmt(m.tmin_f)}</td>
        <td>${fmt(m.precip_in)}</td>
        <td>${fmt(m.wind_max_kt)}</td>
        <td>${fmt(m.init_time_utc)}</td>
      </tr>`;
    }

    const rows = modelMap.map(m => rowHtml(m.label, data?.models?.[m.key] ?? null));

    document.querySelector('#models-table tbody').innerHTML = rows.join('\n');

    // Update figure with cache-busting
    const fig = document.getElementById('fig');
    fig.src = `../images/wxchallenge/latest.png?t=${Date.now()}`;
    fig.alt = `Latest figure for ${site}`;

  } catch (err) {
    // show a simple error state and log the error
    document.querySelector('#models-table tbody').innerHTML = '<tr><td colspan="6">Failed to load forecast data.</td></tr>';
    document.getElementById('updated').textContent = 'Last updated: —';
    console.error(err);
  }
})();
</script>
</body>
</html>
